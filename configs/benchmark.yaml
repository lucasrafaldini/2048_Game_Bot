# Benchmark Configuration Template
# Copy to benchmark.yaml and customize

benchmark:
  num_games: 100
  max_moves: 10000
  parallel: true
  num_workers: 4
  record_history: false
  verbose: false

agents:
  # Expectimax variants
  expectimax:
    depth: 6
    time_limit: 0.1
    weights:
      empty: 2.7
      monotonicity: 1.0
      smoothness: 0.1
      max_tile: 1.0
      merges: 1.5
      edge_max: 0.5
      corner_max: 1.0

  expectimax-fast:
    depth: 4
    time_limit: 0.05

  expectimax-deep:
    depth: 8
    time_limit: 0.5

  # MCTS variants
  mcts:
    simulations: 100
    time_limit: 0.1
    exploration_constant: 1.414

  mcts-fast:
    simulations: 50
    time_limit: 0.05

  mcts-deep:
    simulations: 500
    time_limit: 0.5

  # Heuristic agents
  greedy: {}
  snake: {}
  monotonic: {}

  # Lookahead
  lookahead-2:
    depth: 2
  lookahead-3:
    depth: 3

comparison:
  agents:
    - expectimax
    - mcts
    - greedy
    - snake
  num_games: 50

storage:
  type: sqlite  # or parquet
  path: benchmarks.db

visualization:
  output_dir: benchmark_charts
  formats: [html, png]
  create_dashboard: true